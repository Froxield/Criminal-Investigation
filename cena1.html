<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Crime Scene</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =========================
       SCENE
    ========================= */

    .scene-container {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }


    .scene-image {
      width: 100vw;
      height: 100vh;

      object-fit: contain;

      display: block;
    }


    /* =========================
       INVISIBLE CLUE BUTTONS
    ========================= */

    .clue {
      position: absolute;

      width: 50px;
      height: 50px;

      transform: translate(-50%, -50%);

      background: transparent;

      border: none;
      outline: none;

      z-index: 20;

      cursor: pointer;

      padding: 0;
    }


    .clue:hover {
      background: rgba(255, 255, 255, 0.08);

      border-radius: 50%;
    }


    /* =========================
       CLUE POSITIONS
    ========================= */

    .clue-1 {
      left: 51%;
      top: 19%;
    }


    .clue-2 {
      left: 39%;
      top: 74%;
    }


    .clue-3 {
      left: 36%;
      top: 86%;
    }


    .clue-4 {
      left: 76%;
      top: 73%;
    }


    .clue-5 {
      left: 52%;
      top: 80%;
    }


    .clue-6 {
      left: 97%;
      top: 62%;
    }


    .clue-7 {
      left: 6%;
      top: 85%;
    }


    .clue-8 {
      left: 14%;
      top: 60%;
    }


    /* =========================
       EVIDENCE POPUP
    ========================= */

    .evidence-popup {
      position: fixed;

      top: 30px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(-20px);

      z-index: 9999;

      padding: 17px 30px;

      background: rgba(10, 10, 10, 0.97);

      border: 1px solid #b71919;

      border-top: 3px solid #e12525;

      color: white;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      text-align: center;

      box-shadow:
        0 10px 40px
        rgba(0, 0, 0, 0.8);

      opacity: 0;

      animation:
        evidencePopup
        3s
        ease
        forwards;
    }


    @keyframes evidencePopup {

      0% {
        opacity: 0;

        transform:
          translateX(-50%)
          translateY(-20px);
      }

      15% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0);
      }

      85% {
        opacity: 1;

        transform:
          translateX(-50%)
          translateY(0);
      }

      100% {
        opacity: 0;

        transform:
          translateX(-50%)
          translateY(-20px);
      }

    }


    /* =========================
       BOTTOM BUTTONS
    ========================= */

    .bottom-button {
      position: fixed;

      bottom: 25px;

      z-index: 50;

      padding: 15px 25px;

      background: #b71919;

      border: 1px solid #e02b2b;

      color: white;

      text-decoration: none;

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;

      transition:
        background 0.25s ease,
        transform 0.25s ease,
        box-shadow 0.25s ease;
    }


    .bottom-button:hover {
      background: #d02121;

      transform: translateY(-3px);

      box-shadow:
        0 10px 30px
        rgba(183, 25, 25, 0.4);
    }


    /* Evidence Room */

    .evidence-button {
      left: 25px;
    }


    /* Back to Office */

    .office-button {
      right: 25px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .clue {
        width: 40px;
        height: 40px;
      }


      .bottom-button {
        bottom: 15px;

        padding: 13px 18px;

        font-size: 10px;
      }


      .evidence-button {
        left: 15px;
      }


      .office-button {
        right: 15px;
      }


      .evidence-popup {
        width: calc(100% - 30px);

        padding: 15px 18px;

        font-size: 10px;

        letter-spacing: 1.5px;
      }

    }

  </style>

</head>

<body>

  <script>

    let currentPopup = null;


    function collectEvidence(itemName) {


      /* =========================
         LOAD EVIDENCE
      ========================= */

      let evidence =
        JSON.parse(
          localStorage.getItem(
            "collectedEvidence"
          ) || "[]"
        );


      /* =========================
         ADD EVIDENCE
      ========================= */

      if (
        !evidence.includes(itemName)
      ) {

        evidence.push(itemName);

        localStorage.setItem(
          "collectedEvidence",
          JSON.stringify(evidence)
        );

      }


      /* =========================
         REMOVE OLD POPUP
      ========================= */

      if (currentPopup) {

        currentPopup.remove();

        currentPopup = null;

      }


      /* =========================
         CREATE POPUP
      ========================= */

      const popup =
        document.createElement(
          "div"
        );


      popup.className =
        "evidence-popup";


      popup.textContent =
        itemName +
        " was added to evidence";


      document.body.appendChild(
        popup
      );


      currentPopup =
        popup;


      /* =========================
         REMOVE POPUP
      ========================= */

      setTimeout(

        function() {

          if (
            popup ===
            currentPopup
          ) {

            popup.remove();

            currentPopup = null;

          }

        },

        3000

      );

    }

  </script>
